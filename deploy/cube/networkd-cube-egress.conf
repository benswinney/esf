# Install as /etc/systemd/networkd.conf.d/cube-egress.conf, then restart
# systemd-networkd. By default networkd deletes every routing policy rule it
# did not create when it starts. A networkd restart (for example by an
# unattended upgrade) then removes Cube's two fwmark rules for table 100, and
# sandbox traffic no longer reaches CubeEgress.
[Network]
ManageForeignRoutingPolicyRules=no
